<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}defex — Robots for manufacturing, with vision.{% endblock %}</title>
    <meta name="description" content="{% block description %}Defex builds robots that catch defective products before they ship. Trained on your products. Inspecting offline.{% endblock %}">
    <link rel="canonical" href="{% block canonical %}https://defex.app/{% endblock %}">
    <meta name="theme-color" content="{% block theme_color %}#090F15{% endblock %}">
    <meta name="color-scheme" content="{% block color_scheme %}dark{% endblock %}">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="defex">
    <meta property="og:title" content="{% block og_title %}defex — Robots for manufacturing, with vision.{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Defex builds robots that catch defective products before they ship. Trained on your products. Inspecting offline.{% endblock %}">
    <meta property="og:url" content="{% block og_url %}https://defex.app/{% endblock %}">
    <meta property="og:image" content="https://defex.app{% static 'img/og.jpg' %}">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The Defex robot's camera eye beside the words ultra inspection">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}defex — Robots for manufacturing, with vision.{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Defex builds robots that catch defective products before they ship. Trained on your products. Inspecting offline.{% endblock %}">
    <meta name="twitter:image" content="https://defex.app{% static 'img/og.jpg' %}">

    <link rel="icon" type="image/svg+xml" href="{% static 'img/defex-mark.svg' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon-16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "defex",
      "url": "https://defex.app",
      "logo": "https://defex.app{% static 'img/og.jpg' %}",
      "description": "Defex builds robots for manufacturing, with vision.",
      "email": "husan@defex.app",
      "address": {"@type": "PostalAddress", "addressLocality": "San Francisco", "addressRegion": "CA", "addressCountry": "US"}
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/site.css' %}?v=7">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
