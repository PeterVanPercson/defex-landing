<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}defex — Self-teaching robots for manufacturing.{% endblock %}</title>
    <meta name="keywords" content="{% block keywords %}self-teaching robots, robotic connector assembly, robot insertion, continuity testing, force verification, assembly setup reduction, factory workstation automation, manufacturing automation, defex{% endblock %}">
    <meta name="description" content="{% block description %}Defex builds assembly robots that learn from physical tests. The robot attempts a connector assembly, a test scores the joint, and a reset starts the next try.{% endblock %}">
    <meta name="google-site-verification" content="dgatfCwRWASvUL2_glDXe0rc2x8Cnxlu_Sn27S1Y9ck">
    <link rel="canonical" href="{% block canonical %}https://defex.app/{% endblock %}">
    <meta name="theme-color" content="{% block theme_color %}#090F15{% endblock %}">
    <meta name="color-scheme" content="{% block color_scheme %}dark{% endblock %}">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="defex">
    <meta property="og:title" content="{% block og_title %}defex — Self-teaching robots for manufacturing.{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Defex builds assembly robots that learn from physical tests. The robot attempts a connector assembly, a test scores the joint, and a reset starts the next try.{% endblock %}">
    <meta property="og:url" content="{% block og_url %}https://defex.app/{% endblock %}">
    <meta property="og:image" content="https://defex.app{% static 'img/og.jpg' %}?v={{ asset_v }}">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Defex — self-teaching robots for manufacturing">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}defex — Self-teaching robots for manufacturing.{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Defex builds assembly robots that learn from physical tests. The robot attempts a connector assembly, a test scores the joint, and a reset starts the next try.{% endblock %}">
    <meta name="twitter:image" content="https://defex.app{% static 'img/og.jpg' %}?v={{ asset_v }}">

    <link rel="icon" type="image/svg+xml" href="{% static 'img/defex-mark.svg' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon-16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}">

    <!-- One graph, so Google resolves defex and its founder as linked entities.
         husanmavlonov.com already points its Person node at defex.app/#org; this
         is the other half of that link. knowsAbout carries the search terms
         structurally, which is what actually gets read, rather than stuffing
         them into visible copy. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://defex.app/#org",
          "name": "defex",
          "alternateName": ["Defex", "defex.app", "Defex AI", "Дефекс"],
          "url": "https://defex.app/",
          "logo": {"@type": "ImageObject", "url": "https://defex.app{% static 'img/apple-touch-icon.png' %}", "width": 180, "height": 180},
          "image": "https://defex.app{% static 'img/og.jpg' %}?v={{ asset_v }}",
          "description": "Defex builds self-teaching assembly robots for manufacturing. The robot practises an assembly, a physical test scores the joint it just made, and a reset prepares the next attempt. First workstation: connector assembly.",
          "slogan": "Self-teaching robots for manufacturing.",
          "email": "husan@defex.app",
          "foundingDate": "2025",
          "founder": {
            "@type": "Person",
            "@id": "https://husanmavlonov.com/#person",
            "name": "Husan Mavlonov",
            "alternateName": ["Хусан Мавлонов", "Xusan Mavlonov", "Husan Mavlonоv"],
            "url": "https://husanmavlonov.com/"
          },
          "address": {"@type": "PostalAddress", "addressLocality": "San Francisco", "addressRegion": "CA", "addressCountry": "US"},
          "areaServed": ["US", "UZ", "CN", "KG", "KZ"],
          "knowsAbout": [
            "self-teaching robots",
            "robotic connector assembly",
            "robot insertion and alignment",
            "electrical continuity testing",
            "force and mechanical engagement testing",
            "physical practice learning",
            "automated reset and retry",
            "assembly setup reduction",
            "factory workstation automation",
            "industrial robotics",
            "manufacturing automation",
            "robot skill learning"
          ],
          "sameAs": [
            "https://husanmavlonov.com/",
            "https://www.linkedin.com/in/husan-mavlonov",
            "https://github.com/PeterVanPercson",
            "https://x.com/MavlonovHusan"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://defex.app/#website",
          "url": "https://defex.app/",
          "name": "defex",
          "inLanguage": "en",
          "publisher": {"@id": "https://defex.app/#org"}
        },
        {
          "@type": "WebPage",
          "@id": "{% block page_id %}https://defex.app/{% endblock %}#webpage",
          "url": "{% block page_url %}https://defex.app/{% endblock %}",
          "name": "{% block page_name %}defex — Self-teaching robots for manufacturing.{% endblock %}",
          "isPartOf": {"@id": "https://defex.app/#website"},
          "about": {"@id": "https://defex.app/#org"},
          "inLanguage": "en"
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/site.css' %}?v={{ asset_v }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
