<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}defex — Self-teaching robots for manufacturing.{% endblock %}</title>
    <meta name="keywords" content="{% block keywords %}self-teaching robots, robotic assembly, physical practice, force verification, factory assembly robot, connector assembly, manufacturing automation, defex{% endblock %}">
    <meta name="description" content="{% block description %}Defex builds assembly robots that learn through physical practice — assemble, verify, recover.{% endblock %}">
    <meta name="google-site-verification" content="dgatfCwRWASvUL2_glDXe0rc2x8Cnxlu_Sn27S1Y9ck">
    <link rel="canonical" href="{% block canonical %}https://defex.app/{% endblock %}">
    <meta name="theme-color" content="{% block theme_color %}#090F15{% endblock %}">
    <meta name="color-scheme" content="{% block color_scheme %}dark{% endblock %}">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="defex">
    <meta property="og:title" content="{% block og_title %}defex — Self-teaching robots for manufacturing.{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Defex builds assembly robots that learn through physical practice — assemble, verify, recover.{% endblock %}">
    <meta property="og:url" content="{% block og_url %}https://defex.app/{% endblock %}">
    <meta property="og:image" content="https://defex.app{% static 'img/og.jpg' %}">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Defex — self-teaching robots for manufacturing">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}defex — Self-teaching robots for manufacturing.{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Defex builds assembly robots that learn through physical practice — assemble, verify, recover.{% endblock %}">
    <meta name="twitter:image" content="https://defex.app{% static 'img/og.jpg' %}">

    <link rel="icon" type="image/svg+xml" href="{% static 'img/defex-mark.svg' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon-16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}">

    <!-- One graph, so Google resolves defex and its founder as linked entities.
         husanmavlonov.com already points its Person node at defex.app/#org; this
         is the other half of that link. knowsAbout carries the search terms
         structurally, which is what actually gets read, rather than stuffing
         them into visible copy. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://defex.app/#org",
          "name": "defex",
          "alternateName": ["Defex", "defex.app", "Defex AI", "Дефекс"],
          "url": "https://defex.app/",
          "logo": {"@type": "ImageObject", "url": "https://defex.app{% static 'img/og.jpg' %}", "width": 1200, "height": 630},
          "image": "https://defex.app{% static 'img/og.jpg' %}",
          "description": "Defex builds self-teaching assembly robots for manufacturing. Practice, physical tests, and reliable resets in a supported factory workstation.",
          "slogan": "Self-teaching robots for manufacturing.",
          "email": "husan@defex.app",
          "foundingDate": "2025",
          "founder": {
            "@type": "Person",
            "@id": "https://husanmavlonov.com/#person",
            "name": "Husan Mavlonov",
            "alternateName": ["Хусан Мавлонов", "Xusan Mavlonov", "Husan Mavlonоv"],
            "url": "https://husanmavlonov.com/"
          },
          "address": {"@type": "PostalAddress", "addressLocality": "San Francisco", "addressRegion": "CA", "addressCountry": "US"},
          "areaServed": ["US", "UZ", "CN", "KG", "KZ"],
          "knowsAbout": [
            "self-teaching robots",
            "robotic assembly",
            "physical practice learning",
            "force and continuity testing",
            "connector assembly",
            "factory workstation automation",
            "industrial robotics",
            "assembly verification",
            "manufacturing automation",
            "robot skill learning"
          ],
          "sameAs": [
            "https://husanmavlonov.com/",
            "https://www.linkedin.com/in/husan-mavlonov",
            "https://github.com/PeterVanPercson",
            "https://x.com/MavlonovHusan"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://defex.app/#website",
          "url": "https://defex.app/",
          "name": "defex",
          "inLanguage": "en",
          "publisher": {"@id": "https://defex.app/#org"}
        },
        {
          "@type": "WebPage",
          "@id": "{% block page_id %}https://defex.app/{% endblock %}#webpage",
          "url": "{% block page_url %}https://defex.app/{% endblock %}",
          "name": "{% block page_name %}defex — Self-teaching robots for manufacturing.{% endblock %}",
          "isPartOf": {"@id": "https://defex.app/#website"},
          "about": {"@id": "https://defex.app/#org"},
          "inLanguage": "en"
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/site.css' %}?v={{ asset_v }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
