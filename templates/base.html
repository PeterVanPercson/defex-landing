<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Defex Robotics | Self-teaching robots for manufacturing{% endblock %}</title>
    <meta name="description" content="{% block description %}Defex is developing self-teaching assembly robots for manufacturing, starting with connector assembly. Meet the founders and explore our work.{% endblock %}">
    <meta name="google-site-verification" content="dgatfCwRWASvUL2_glDXe0rc2x8Cnxlu_Sn27S1Y9ck">
    <link rel="canonical" href="{% block canonical %}{{ canonical_url }}{% endblock %}">
    <link rel="alternate" type="application/rss+xml" title="Defex blog" href="https://defexrobotics.com/blog/feed.xml">
    <meta name="theme-color" content="{% block theme_color %}#090F15{% endblock %}">
    <meta name="color-scheme" content="{% block color_scheme %}dark{% endblock %}">

    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:site_name" content="Defex Robotics">
    <meta property="og:title" content="{% block og_title %}Defex Robotics | Self-teaching robots for manufacturing{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Defex is developing self-teaching assembly robots for manufacturing, starting with connector assembly.{% endblock %}">
    <meta property="og:url" content="{% block og_url %}{{ canonical_url }}{% endblock %}">
    <meta property="og:image" content="https://defexrobotics.com{% static 'img/og.jpg' %}?v={{ asset_v }}">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Defex Robotics | Self-teaching robots for manufacturing">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}Defex Robotics | Self-teaching robots for manufacturing{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Defex is developing self-teaching assembly robots for manufacturing, starting with connector assembly.{% endblock %}">
    <meta name="twitter:image" content="https://defexrobotics.com{% static 'img/og.jpg' %}?v={{ asset_v }}">

    <link rel="icon" type="image/svg+xml" href="{% static 'img/defex-mark.svg' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon-16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}">

    <script type="application/ld+json">{{ organization_jsonld|safe }}</script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "@id": "{% block page_id %}{{ canonical_url|escapejs }}{% endblock %}#webpage",
      "url": "{% block page_url %}{{ canonical_url|escapejs }}{% endblock %}",
      "name": "{% block page_name %}Defex Robotics | Self-teaching robots for manufacturing{% endblock %}",
      "isPartOf": {"@id": "https://defexrobotics.com/#website"},
      "about": {"@id": "https://defexrobotics.com/#org"},
      "inLanguage": "en"
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/site.css' %}?v={{ asset_v }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    {% block extra_scripts %}{% endblock %}
    {% if web_analytics %}<script defer src="/_vercel/insights/script.js"></script>{% endif %}
</body>
</html>
