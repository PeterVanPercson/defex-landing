{% load static %}<style>
@font-face { font-family: 'Newsreader'; font-weight: 400; font-display: swap; src: url({% static 'fonts/newsreader-400-normal.woff2' %}) format('woff2'); }
@font-face { font-family: 'EB Garamond'; font-weight: 400; font-display: swap; src: url({% static 'fonts/eb-garamond-400-normal.woff2' %}) format('woff2'); }
html, body { margin: 0; min-height: 100%; background: #F3EFE8; color: #1A1815; }
body { min-height: 100svh; display: grid; place-items: center; font: 400 19px/1.55 "EB Garamond", Georgia, serif; -webkit-font-smoothing: antialiased; }
.err { padding: 24px 16px; text-align: center; }
.err h1 { margin: 0 0 18px; font: 400 clamp(36px, 6vw, 56px)/1.08 "Newsreader", "Iowan Old Style", Georgia, serif; letter-spacing: -.01em; }
.err p { margin: 0; }
.err a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.err a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; border-radius: 2px; }
</style>
