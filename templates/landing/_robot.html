{# the robot on Why us, drawn in flat shapes. static/js/meet.js runs its job on a loop and flies the camera to the part you pick. Without JS it stands in its seated pose. #}<svg class="rb" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
    <defs>
        <g id="rb-p-three"><rect x="-22" y="-30" width="44" height="30" rx="6" fill="#F4F4F0"/><rect x="-14" y="-21" width="6" height="12" rx="2" fill="#0A0A0A"/><rect x="-3" y="-21" width="6" height="12" rx="2" fill="#0A0A0A"/><rect x="8" y="-21" width="6" height="12" rx="2" fill="#0A0A0A"/></g>
        <g id="rb-p-six"><rect x="-30" y="-30" width="60" height="30" rx="6" fill="#3D63FF"/><rect x="-20" y="-24" width="7" height="8" rx="2" fill="#F4F4F0"/><rect x="-3.5" y="-24" width="7" height="8" rx="2" fill="#F4F4F0"/><rect x="13" y="-24" width="7" height="8" rx="2" fill="#F4F4F0"/><rect x="-20" y="-13" width="7" height="8" rx="2" fill="#F4F4F0"/><rect x="-3.5" y="-13" width="7" height="8" rx="2" fill="#F4F4F0"/><rect x="13" y="-13" width="7" height="8" rx="2" fill="#F4F4F0"/></g>
        <g id="rb-p-round"><circle cx="0" cy="-16" r="16" fill="#9AA1A9"/><circle cx="0" cy="-16" r="9" fill="none" stroke="#0A0A0A" stroke-width="4"/><circle cx="0" cy="-16" r="3" fill="#3D63FF"/></g>
        <!-- a packed unit standing in the tote: the plug's colour on top, the board's below -->
        <linearGradient id="rb-bar" x1="0" y1="0" x2="0" y2="1"><stop class="rb__stop rb__stop--top" offset="0"/><stop class="rb__stop rb__stop--top" offset=".3"/><stop class="rb__stop rb__stop--body" offset=".3"/><stop class="rb__stop rb__stop--body" offset="1"/></linearGradient>
        <!-- a reject posted through the slot disappears into the locked bin -->
        <clipPath id="rb-above"><rect x="0" y="-200" width="1000" height="670"/></clipPath>
    </defs>
    <g class="rb__scene">
        <path class="rb__floor" d="M40 600 H960"/>

        <!-- the frame -->
        <rect class="rb__frame" x="88" y="84" width="22" height="516" rx="6"/>
        <rect class="rb__frame" x="890" y="84" width="22" height="516" rx="6"/>
        <rect class="rb__frame" x="80" y="78" width="840" height="30" rx="10"/>

        <!-- the brain: the computer under the bench, wired to the arm -->
        <g data-part="brain">
            <path class="rb__cable" id="rb-cable" d="M440 96 H132 Q120 96 120 108 V480 Q120 500 140 500 H176 Q190 500 190 512"/>
            <circle class="rb__pulse" r="7" cx="440" cy="96"/>
            <rect class="rb__brain" x="148" y="512" width="162" height="80" rx="12"/>
            <rect class="rb__fin" x="164" y="503" width="8" height="12" rx="2"/><rect class="rb__fin" x="180" y="503" width="8" height="12" rx="2"/><rect class="rb__fin" x="196" y="503" width="8" height="12" rx="2"/><rect class="rb__fin" x="212" y="503" width="8" height="12" rx="2"/><rect class="rb__fin" x="228" y="503" width="8" height="12" rx="2"/><rect class="rb__fin" x="244" y="503" width="8" height="12" rx="2"/>
            <rect class="rb__screen" x="162" y="526" width="116" height="52" rx="6"/>
            <rect class="rb__bar is-lit" x="172" y="560" width="10" height="12" rx="2"/>
            <rect class="rb__bar is-lit" x="189" y="556" width="10" height="16" rx="2"/>
            <rect class="rb__bar is-lit" x="206" y="551" width="10" height="21" rx="2"/>
            <rect class="rb__bar is-lit" x="223" y="545" width="10" height="27" rx="2"/>
            <rect class="rb__bar" x="240" y="539" width="10" height="33" rx="2"/>
            <rect class="rb__bar" x="257" y="532" width="10" height="40" rx="2"/>
            <circle class="rb__led" cx="294" cy="578" r="5"/>
        </g>

        <!-- the packer rides the beam behind the tester's screen -->
        <g data-part="reset">
            <rect class="rb__car" x="632" y="100" width="40" height="24" rx="6"/>
            <rect class="rb__rod" x="648" y="124" width="8" height="26"/>
            <rect class="rb__clamp" x="622" y="150" width="60" height="16" rx="5"/>
        </g>

        <!-- the tester: its screen, the light on top, and the dock that meets the pallet -->
        <g data-part="tester">
            <rect class="rb__display" x="700" y="196" width="180" height="156" rx="14"/>
            <g class="rb__check"><circle cx="728" cy="232" r="11"/><text x="750" y="239">Seated</text></g>
            <g class="rb__check"><circle cx="728" cy="272" r="11"/><text x="750" y="279">Held</text></g>
            <g class="rb__check"><circle cx="728" cy="312" r="11"/><text x="750" y="319">Wires</text></g>
            <path class="rb__mark" d="M0 0"/>
            <rect class="rb__mast" x="856" y="58" width="16" height="22" rx="3"/>
            <rect class="rb__lamp rb__lamp--run" x="848" y="4" width="32" height="16" rx="5"/>
            <rect class="rb__lamp rb__lamp--pass" x="848" y="22" width="32" height="16" rx="5"/>
            <rect class="rb__lamp rb__lamp--fail" x="848" y="40" width="32" height="16" rx="5"/>
            <path class="rb__cable rb__cable--thin" id="rb-dockcable" d="M740 352 C 740 400, 660 435, 640 435"/>
            <rect class="rb__dock" x="0" y="418" width="70" height="34" rx="8" transform="translate(570 0)"/>
        </g>

        <!-- the bench -->
        <rect class="rb__leg" x="140" y="488" width="16" height="112" rx="4"/>
        <rect class="rb__leg" x="846" y="488" width="16" height="112" rx="4"/>
        <rect class="rb__bench" x="110" y="470" width="780" height="20" rx="6"/>

        <!-- the reset: the line moves the pallets, good units into the tote, rejects into the locked bin -->
        <g data-part="reset">
            <rect class="rb__slot" x="618" y="470" width="64" height="6" rx="2"/>
            <rect class="rb__vault" x="598" y="534" width="104" height="60" rx="6"/>
            <rect class="rb__lid" x="592" y="520" width="116" height="14" rx="5"/>
            <path class="rb__padlock" d="M644 555 H641 V571 H659 V555 H656 V549 A6 6 0 0 0 644 549 Z M647 555 V549 A3 3 0 0 1 653 549 V555 Z" fill-rule="evenodd"/>
            <text class="rb__label" x="650" y="512">Rejects</text>
            <rect class="rb__belt" x="128" y="452" width="634" height="18" rx="9"/>
            <path class="rb__tread" d="M140 452 H750"/>
            <circle class="rb__roller" cx="140" cy="461" r="6"/><circle class="rb__roller" cx="750" cy="461" r="6"/>
            <path class="rb__bin" d="M768 418 V470 H876 V418"/>
            <rect class="rb__packed" x="789" y="427.5" width="14" height="40"/>
            <rect class="rb__packed" x="815" y="427.5" width="14" height="40"/>
            <rect class="rb__packed" x="841" y="427.5" width="14" height="40" style="opacity: 0"/>
            <text class="rb__label" x="822" y="512">Tote</text>
        </g>

        <!-- vision: a camera low on the post looks up at the plug in the fingers -->
        <g data-part="vision">
            <path class="rb__cone rb__cone--up" d="M0 0"/>
            <path class="rb__cone rb__cone--down" d="M0 0"/>
            <path class="rb__scan" d="M0 0"/>
            <path class="rb__lock" d="M0 0"/>
            <g transform="translate(142 380) rotate(-12)">
                <rect class="rb__cam" x="-30" y="-19" width="60" height="38" rx="9"/>
                <circle class="rb__lens" cx="30" cy="0" r="13"/>
                <circle class="rb__iris" cx="30" cy="0" r="5"/>
            </g>
        </g>

        <!-- your part: a board on its pallet, its plug waiting at the pallet's end -->
        <g data-part="part">
            <g class="rb__pallet" transform="translate(210 452)">
                <path class="rb__plate" d="M-80 -10 Q-80 -14 -76 -14 H26 V-30 Q26 -34 30 -34 H76 Q80 -34 80 -30 V0 H-80 Z"/>
                <rect class="rb__board" x="-80" y="-34" width="104" height="20" rx="4"/>
                <rect class="rb__header" x="-58" y="-46" width="60" height="12" rx="3"/>
                <use class="rb__plug" href="#rb-p-three" x="0" y="0" transform="translate(53 -34)"/>
            </g>
            <g class="rb__pallet" transform="translate(450 452)">
                <path class="rb__plate" d="M-80 -10 Q-80 -14 -76 -14 H26 V-30 Q26 -34 30 -34 H76 Q80 -34 80 -30 V0 H-80 Z"/>
                <rect class="rb__board" x="-80" y="-34" width="104" height="20" rx="4"/>
                <rect class="rb__header" x="-58" y="-46" width="60" height="12" rx="3"/>
                <use class="rb__plug" href="#rb-p-three" x="0" y="0" transform="translate(-28 -43)"/>
            </g>
            <g class="rb__pallet" transform="translate(680 452)" style="opacity: 0">
                <path class="rb__plate" d="M-80 -10 Q-80 -14 -76 -14 H26 V-30 Q26 -34 30 -34 H76 Q80 -34 80 -30 V0 H-80 Z"/>
                <rect class="rb__board" x="-80" y="-34" width="104" height="20" rx="4"/>
                <rect class="rb__header" x="-58" y="-46" width="60" height="12" rx="3"/>
                <use class="rb__plug" href="#rb-p-three" x="0" y="0" transform="translate(-28 -43)"/>
            </g>
            <rect class="rb__cap" x="0" y="0" width="14" height="12" style="opacity: 0"/>
        </g>

        <!-- the arm hangs from the beam; the plug and the gripper ride on it -->
        <g data-part="arm">
            <rect class="rb__carriage" x="436" y="96" width="68" height="44" rx="10"/>
            <g class="rb__upper" transform="translate(470 150) rotate(160.85)"><rect x="-17" y="-17" width="199" height="34" rx="17"/></g>
            <g class="rb__fore" transform="translate(314.13 204.14) rotate(49.18)"><rect x="-13" y="-13" width="191" height="26" rx="13"/></g>
            <circle class="rb__joint" cx="470" cy="150" r="24"/><circle class="rb__pin" cx="470" cy="150" r="8"/>
            <g class="rb__elbow" transform="translate(314.13 204.14)"><circle class="rb__joint" r="19"/><circle class="rb__pin" r="6"/></g>
        </g>
        <g data-part="part">
            <g clip-path="url(#rb-above)"><use class="rb__part" href="#rb-p-three" x="0" y="0" transform="translate(422 409)" style="opacity: 0"/></g>
        </g>
        <g data-part="arm">
            <g class="rb__wrist" transform="translate(422 329)">
                <rect class="rb__grip" x="-36" y="20" width="72" height="14" rx="6"/>
                <rect class="rb__finger rb__finger--l" x="-5" y="30" width="10" height="50" rx="4" transform="translate(-27 0)"/>
                <rect class="rb__finger rb__finger--r" x="-5" y="30" width="10" height="50" rx="4" transform="translate(27 0)"/>
                <rect class="rb__wcam" x="-66" y="6" width="30" height="22" rx="5"/>
                <circle class="rb__wlens" cx="-51" cy="28" r="6"/>
                <circle class="rb__wj" r="12"/>
                <g data-part="touch">
                    <circle class="rb__ring" cy="14" r="14"/>
                    <rect class="rb__puck" x="-22" y="7" width="44" height="14" rx="5"/>
                </g>
            </g>
        </g>
    </g>
</svg>
