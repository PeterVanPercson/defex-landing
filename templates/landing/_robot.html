{# the robot on home, Why us and Prototype, drawn in flat shapes: the same cell as /prototype/. static/js/meet.js runs its job on a loop and flies the camera to the part you pick. Without JS it stands in its seated pose. #}<svg class="rb" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
    <defs>
        <g id="rb-p-three"><rect x="-22" y="-30" width="44" height="30" rx="6" fill="#F4F4F0"/><rect x="-14" y="-21" width="6" height="12" rx="2" fill="#0A0A0A"/><rect x="-3" y="-21" width="6" height="12" rx="2" fill="#0A0A0A"/><rect x="8" y="-21" width="6" height="12" rx="2" fill="#0A0A0A"/></g>
        <g id="rb-p-six"><rect x="-30" y="-30" width="60" height="30" rx="6" fill="#3D63FF"/><rect x="-20" y="-24" width="7" height="8" rx="2" fill="#F4F4F0"/><rect x="-3.5" y="-24" width="7" height="8" rx="2" fill="#F4F4F0"/><rect x="13" y="-24" width="7" height="8" rx="2" fill="#F4F4F0"/><rect x="-20" y="-13" width="7" height="8" rx="2" fill="#F4F4F0"/><rect x="-3.5" y="-13" width="7" height="8" rx="2" fill="#F4F4F0"/><rect x="13" y="-13" width="7" height="8" rx="2" fill="#F4F4F0"/></g>
        <g id="rb-p-round"><circle cx="0" cy="-16" r="16" fill="#9AA1A9"/><circle cx="0" cy="-16" r="9" fill="none" stroke="#0A0A0A" stroke-width="4"/><circle cx="0" cy="-16" r="3" fill="#3D63FF"/></g>
        <!-- a unit's board on its pallet: the board and the header the plug goes onto -->
        <g id="rb-board"><rect x="-60" y="-14" width="74" height="14" rx="3" class="rb__pcb"/><rect x="-44" y="-20" width="44" height="7" rx="2" class="rb__header"/></g>
        <!-- a pallet: the plate, the nest the plug waits in and the test adapter the harness's far end sits in -->
        <g id="rb-pallet"><rect x="-82" y="-12" width="164" height="12" rx="4" class="rb__plate"/><rect x="18" y="-22" width="36" height="10" rx="3" class="rb__nest"/><rect x="60" y="-26" width="18" height="14" rx="3" class="rb__adapter"/></g>
        <!-- a passed unit, packed on edge in the tote -->
        <g id="rb-packed"><rect x="-6" y="-46" width="12" height="46" rx="3" class="rb__pcb"/><rect x="-4" y="-56" width="8" height="12" rx="2" class="rb__plugtop"/></g>
    </defs>
    <g class="rb__scene">
        <path class="rb__floor" d="M40 600 H960"/>

        <!-- the brain: the computer under the bench, wired to the arm -->
        <g data-part="brain">
            <path class="rb__cable" id="rb-cable" d="M600 470 V496 Q600 506 590 506 H330 Q314 506 314 522 V540"/>
            <circle class="rb__pulse" r="7" cx="600" cy="470"/>
            <rect class="rb__brain" x="152" y="512" width="162" height="80" rx="12"/>
            <rect class="rb__fin" x="168" y="503" width="8" height="12" rx="2"/><rect class="rb__fin" x="184" y="503" width="8" height="12" rx="2"/><rect class="rb__fin" x="200" y="503" width="8" height="12" rx="2"/><rect class="rb__fin" x="216" y="503" width="8" height="12" rx="2"/><rect class="rb__fin" x="232" y="503" width="8" height="12" rx="2"/><rect class="rb__fin" x="248" y="503" width="8" height="12" rx="2"/>
            <rect class="rb__screen" x="166" y="526" width="116" height="52" rx="6"/>
            <rect class="rb__bar is-lit" x="176" y="560" width="10" height="12" rx="2"/>
            <rect class="rb__bar is-lit" x="193" y="556" width="10" height="16" rx="2"/>
            <rect class="rb__bar is-lit" x="210" y="551" width="10" height="21" rx="2"/>
            <rect class="rb__bar is-lit" x="227" y="545" width="10" height="27" rx="2"/>
            <rect class="rb__bar" x="244" y="539" width="10" height="33" rx="2"/>
            <rect class="rb__bar" x="261" y="532" width="10" height="40" rx="2"/>
            <circle class="rb__led" cx="298" cy="578" r="5"/>
        </g>

        <!-- the arm stands on the bench behind the line -->
        <g data-part="arm">
            <rect class="rb__base" x="572" y="352" width="56" height="118" rx="10"/>
            <rect class="rb__collar" x="566" y="452" width="68" height="18" rx="5"/>
        </g>

        <!-- the bench -->
        <rect class="rb__leg" x="84" y="488" width="16" height="112" rx="4"/>
        <rect class="rb__leg" x="900" y="488" width="16" height="112" rx="4"/>
        <rect class="rb__bench" x="56" y="470" width="888" height="20" rx="6"/>

        <!-- the reset: pallets index along the line; a gantry packs passed units into the tote; rejects go into the locked bin -->
        <g data-part="reset">
            <rect class="rb__belt" x="168" y="452" width="624" height="18" rx="9"/>
            <path class="rb__tread" d="M180 452 H780"/>
            <circle class="rb__roller" cx="180" cy="461" r="6"/><circle class="rb__roller" cx="780" cy="461" r="6"/>
            <rect class="rb__frame" x="60" y="148" width="12" height="322" rx="4"/>
            <rect class="rb__frame" x="60" y="140" width="244" height="14" rx="5"/>
            <g class="rb__carriage" transform="translate(227 0)">
                <rect class="rb__car" x="-18" y="150" width="36" height="20" rx="5"/>
                <rect class="rb__rod" x="-4" y="168" width="8" height="60" rx="3"/>
                <g class="rb__clamp" transform="translate(0 228)"><rect class="rb__car" x="-30" y="0" width="60" height="10" rx="4"/><rect class="rb__jaw rb__jaw--l" x="-3.5" y="6" width="7" height="24" rx="3" transform="translate(-44 0)"/><rect class="rb__jaw rb__jaw--r" x="-3.5" y="6" width="7" height="24" rx="3" transform="translate(44 0)"/></g>
            </g>
            <g class="rb__lifted"><g transform="translate(23 0)"><use href="#rb-board"/></g><use class="rb__liftplug" href="#rb-p-three" transform="translate(1 -14)"/></g>
            <g class="rb__tote">
                <path class="rb__bin" d="M78 396 V470 H176 V396"/>
            <g class="rb__packed"><g class="rb__slotunit" transform="translate(128 431) rotate(-90)"><g transform="translate(23 0)"><use href="#rb-board"/></g><use class="rb__packplug" href="#rb-p-three" transform="translate(1 -14)"/></g><g class="rb__slotunit" transform="translate(174 431) rotate(-90)"><g transform="translate(23 0)"><use href="#rb-board"/></g><use class="rb__packplug" href="#rb-p-three" transform="translate(1 -14)"/></g></g>
            </g>
            <text class="rb__label" x="127" y="378">Tote</text>
            <rect class="rb__vault" x="812" y="404" width="80" height="66" rx="6"/>
            <rect class="rb__vaultlid" x="806" y="396" width="92" height="12" rx="4"/>
            <rect class="rb__slot" x="834" y="398" width="36" height="5" rx="2"/>
            <rect class="rb__padlock" x="844" y="430" width="16" height="14" rx="3"/><path class="rb__shackle" d="M847 430 V425 a5 5 0 0 1 10 0 V430"/>
            <text class="rb__label" x="852" y="380">Rejects</text>
        </g>

        <!-- the pallets: three on the line, the next one coming in -->
        <g data-part="part">
            <g class="rb__pallet" data-slot="0"><use href="#rb-pallet"/><g class="rb__unitboard" transform="translate(0 -12)"><use href="#rb-board"/></g><use class="rb__nestplug" href="#rb-p-three" transform="translate(36 -16)"/><use class="rb__seatplug" href="#rb-p-three" transform="translate(-22 -26)"/></g>
            <g class="rb__pallet" data-slot="1"><use href="#rb-pallet"/><g class="rb__unitboard" transform="translate(0 -12)"><use href="#rb-board"/></g><use class="rb__nestplug" href="#rb-p-three" transform="translate(36 -16)"/><use class="rb__seatplug" href="#rb-p-three" transform="translate(-22 -26)"/></g>
            <g class="rb__pallet" data-slot="2"><use href="#rb-pallet"/><g class="rb__unitboard" transform="translate(0 -12)"><use href="#rb-board"/></g><use class="rb__nestplug" href="#rb-p-three" transform="translate(36 -16)"/><use class="rb__seatplug" href="#rb-p-three" transform="translate(-22 -26)"/></g>
            <g class="rb__pallet" data-slot="3"><use href="#rb-pallet"/><g class="rb__unitboard" transform="translate(0 -12)"><use href="#rb-board"/></g><use class="rb__nestplug" href="#rb-p-three" transform="translate(36 -16)"/><use class="rb__seatplug" href="#rb-p-three" transform="translate(-22 -26)"/></g>
        </g>

        <!-- vision: the grip camera on the bench looks up at the plug in the fingers -->
        <g data-part="vision">
            <path class="rb__cone rb__cone--up" d="M0 0"/>
            <path class="rb__cone rb__cone--down" d="M0 0"/>
            <path class="rb__scan" d="M0 0"/>
            <path class="rb__lock" d="M0 0"/>
            <rect class="rb__bracket" x="514" y="452" width="44" height="18" rx="4"/>
            <rect class="rb__cam" x="520" y="436" width="32" height="18" rx="5"/>
            <circle class="rb__lens" cx="536" cy="436" r="8"/>
            <circle class="rb__iris" cx="536" cy="436" r="3"/>
        </g>

        <!-- the tester: it docks to the pallet's adapter; its screen and the light on top -->
        <g data-part="tester">
            <path class="rb__cable rb__cable--thin" d="M760 308 C 700 330, 640 426, 572 426"/>
            <rect class="rb__dock" x="556" y="416" width="16" height="22" rx="3"/>
            <rect class="rb__display" x="748" y="160" width="176" height="148" rx="14"/>
            <g class="rb__check" data-check="1"><circle cx="774" cy="190" r="11"/><path class="rb__tick" d="M768 190 l4 4 l8 -8"/><path class="rb__cross" d="M770 186 l8 8 M778 186 l-8 8"/><text x="794" y="196">Seated</text></g>
            <g class="rb__check" data-check="2"><circle cx="774" cy="228" r="11"/><path class="rb__tick" d="M768 228 l4 4 l8 -8"/><path class="rb__cross" d="M770 224 l8 8 M778 224 l-8 8"/><text x="794" y="234">Held</text></g>
            <g class="rb__check" data-check="3"><circle cx="774" cy="266" r="11"/><path class="rb__tick" d="M768 266 l4 4 l8 -8"/><path class="rb__cross" d="M770 262 l8 8 M778 262 l-8 8"/><text x="794" y="272">Wires</text></g>
            <g class="rb__wires"><rect class="rb__wire" x="852" y="260" width="9" height="12" rx="2"/><rect class="rb__wire" x="863" y="260" width="9" height="12" rx="2"/><rect class="rb__wire" x="874" y="260" width="9" height="12" rx="2"/><rect class="rb__wire" x="885" y="260" width="9" height="12" rx="2"/><rect class="rb__wire" x="896" y="260" width="9" height="12" rx="2"/><rect class="rb__wire" x="907" y="260" width="9" height="12" rx="2"/></g>
            <rect class="rb__mast" x="890" y="136" width="16" height="24" rx="3"/>
            <rect class="rb__lamp rb__lamp--run" x="882" y="80" width="32" height="16" rx="5"/>
            <rect class="rb__lamp rb__lamp--pass" x="882" y="98" width="32" height="16" rx="5"/>
            <rect class="rb__lamp rb__lamp--fail" x="882" y="116" width="32" height="16" rx="5"/>
        </g>

        <!-- the harness: from the plug to the pallet's adapter -->
        <g data-part="part"><path class="rb__harness" d="M0 0"/></g>

        <!-- the arm's links; the plug and the gripper ride on it -->
        <g data-part="arm">
            <g class="rb__upper" transform="translate(600 352) rotate(-120)"><rect x="-17" y="-17" width="174" height="34" rx="17"/></g>
            <g class="rb__fore" transform="translate(525 222) rotate(60)"><rect x="-13" y="-13" width="166" height="26" rx="13"/></g>
            <circle class="rb__joint" cx="600" cy="352" r="24"/><circle class="rb__pin" cx="600" cy="352" r="8"/>
            <g class="rb__elbow" transform="translate(525 222)"><circle class="rb__joint" r="19"/><circle class="rb__pin" r="6"/></g>
        </g>
        <g data-part="part">
            <use class="rb__part" href="#rb-p-three" x="0" y="0" transform="translate(432 432)"/>
        </g>
        <g data-part="arm">
            <g class="rb__wrist" transform="translate(432 354)">
                <rect class="rb__grip" x="-36" y="20" width="72" height="14" rx="6"/>
                <rect class="rb__finger rb__finger--l" x="-5" y="30" width="10" height="50" rx="4" transform="translate(-27 0)"/>
                <rect class="rb__finger rb__finger--r" x="-5" y="30" width="10" height="50" rx="4" transform="translate(27 0)"/>
                <circle class="rb__wj" r="12"/>
                <g data-part="vision">
                    <rect class="rb__wcam" x="40" y="-2" width="22" height="28" rx="5"/>
                    <rect class="rb__wring" x="38" y="24" width="26" height="6" rx="3"/>
                </g>
                <g data-part="touch">
                    <circle class="rb__ring" cy="14" r="14"/>
                    <rect class="rb__puck" x="-22" y="7" width="44" height="14" rx="5"/>
                </g>
            </g>
        </g>
    </g>
</svg>
