name: smoke

# Catches the class of breakage this project keeps hitting: a
# nonexistent dependency, an import error, a broken template, a route
# regression, or a 500 on a main page — before it reaches production.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Site regression tests
        run: python manage.py test

      - name: Front-end JavaScript syntax
        run: |
          node --check static/js/hero-film.js
          node --check static/js/origin.js

      - name: collectstatic
        run: python manage.py collectstatic --no-input

      - name: Boot server + hit the real routes
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-smoke-only-not-a-production-secret-000000000000000000000000"
        run: |
          gunicorn config.wsgi:application --bind 127.0.0.1:8000 >/tmp/srv.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 20); do
            curl -sf -H "X-Forwarded-Proto: https" -o /dev/null http://127.0.0.1:8000/ && break
            sleep 1
          done
          for route in / /careers/ /where-it-started/; do
            curl --fail --silent --show-error -H "X-Forwarded-Proto: https" -o /dev/null "http://127.0.0.1:8000$route"
          done
          curl --fail --silent --show-error -H "X-Forwarded-Proto: https" -H "Range: bytes=0-1023" \
            -D /tmp/hero-headers.txt -o /tmp/hero-range.bin \
            http://127.0.0.1:8000/static/defex/assets/defex-intro-v4.mp4
          python -c "from pathlib import Path; assert '206 Partial Content' in Path('/tmp/hero-headers.txt').read_text(); assert len(Path('/tmp/hero-range.bin').read_bytes()) == 1024"
