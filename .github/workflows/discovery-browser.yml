name: discovery-browser

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-browser-only-not-a-production-secret-000000000000000000000000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install site and browser
        run: |
          pip install -r requirements.txt
          npm install -g agent-browser
          agent-browser install --with-deps
      - name: Verify company page at desktop and mobile sizes
        run: |
          mkdir -p browser-artifacts
          python manage.py runserver 127.0.0.1:8000 --noreload >browser-artifacts/server.log 2>&1 &
          server_pid=$!
          trap 'agent-browser close || true; kill "$server_pid"' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8000/company/ && break
            sleep 1
          done
          agent-browser set viewport 1440 1000
          agent-browser open http://127.0.0.1:8000/company/
          agent-browser wait --load networkidle
          agent-browser snapshot -i >browser-artifacts/company-desktop.txt
          agent-browser eval 'if (document.querySelectorAll("h1").length !== 1) throw new Error("Expected one h1"); if (document.documentElement.scrollWidth > innerWidth) throw new Error("Horizontal overflow"); if (!document.body.innerText.includes("21 factories")) throw new Error("Waitlist missing"); if (!document.body.innerText.includes("Hasan Mavlonov")) throw new Error("Founder missing"); if (document.querySelector("link[rel=canonical]").href !== "https://defexrobotics.com/company/") throw new Error("Wrong canonical"); Array.from(document.querySelectorAll("script[type=\"application/ld+json\"]")).forEach(n => JSON.parse(n.textContent)); "desktop: pass"' | tee browser-artifacts/desktop-check.txt
          agent-browser screenshot browser-artifacts/company-desktop.png --full
          agent-browser set viewport 390 844
          agent-browser eval 'if (document.documentElement.scrollWidth > innerWidth) throw new Error("Mobile horizontal overflow"); "mobile: pass"' | tee browser-artifacts/mobile-check.txt
          agent-browser screenshot browser-artifacts/company-mobile.png --full
          agent-browser errors >browser-artifacts/browser-errors.txt
      - name: Package public source for independent review
        if: always()
        run: |
          mkdir -p browser-artifacts/wheels
          pip download -r requirements.txt -d browser-artifacts/wheels
          git archive --format=tar.gz HEAD >browser-artifacts/public-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-browser-review
          path: browser-artifacts/
          retention-days: 3
